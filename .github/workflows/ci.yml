name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 部署到 GitHub Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元测试
        run: npm run test
      - name: 清理并生产构建
        # 本地因 safe-delete 拦截不能用 emptyOutDir，CI 侧直接 rm 保证产物干净（无旧 chunk 残留）
        run: rm -rf dist && npm run build
      - name: 确认浏览器可定位
        # 先解析一次，路径不对时这一步就报清楚的错，不用等回归跑到一半才发现
        run: node -e "import('./scripts/browser.mjs').then(m => console.log('browser:', m.resolveBrowser()))"
      - name: 浏览器回归（CDP 驱动 headless Chrome）
        # 九套脚本：底部 ↑ 三级阶梯 / 整体交互 / 导出折行与分页 / 备份 / 存储降级 /
        # 增量重算 / 无障碍 / 滚动记忆 / 无断言覆盖区的审计。
        # ubuntu-latest 自带 google-chrome，脚本通过 scripts/browser.mjs 自动定位；
        # 预览服务由 run-verify.mjs 起停，构建产物必须已存在（上一步刚 build 完）。
        run: npm run verify
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    # 仅 main 分支的 push 才部署，PR 不触发部署
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
